name: ci-api
on:
  pull_request:  # no path filter: these are required checks, a skipped workflow would block the PR
  push:
    branches: [main]
concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-test:
    name: api lint + mypy + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: stylist, POSTGRES_PASSWORD: stylist, POSTGRES_DB: stylist }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stylist" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: api } }
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://stylist:stylist@localhost:5432/stylist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q
      - name: OpenAPI drift check
        run: python -m app.export_openapi | diff - ../docs/openapi.json

  local-server-smoke:
    name: real local server + smoke test (no Docker)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Start the local API (SQLite, fake Redis, AUTH_MODE=dev)
        run: |
          PORT=8123 python -m app.local_server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8123/health && break; sleep 1; done
      - run: python -m app.smoke http://127.0.0.1:8123
      - if: failure()
        run: cat server.log
