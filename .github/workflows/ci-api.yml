name: ci-api
on:
  pull_request:
    paths: ["api/**", ".github/workflows/ci-api.yml"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: stylist, POSTGRES_PASSWORD: stylist, POSTGRES_DB: stylist }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stylist" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: api } }
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://stylist:stylist@localhost:5432/stylist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest -q
      - name: OpenAPI drift check
        run: python -m app.export_openapi | diff - ../docs/openapi.json
