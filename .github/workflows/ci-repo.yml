name: ci-repo
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-repo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  makefile:
    name: makefile targets resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run every flavor/platform and local-API target
        run: |
          for f in dev staging prod; do
            make -n run-$f-android run-$f-ios apk-$f apk-release-$f ios-$f ipa-$f >/dev/null
          done
          make -n api-local api-smoke run-app-local-api ios-flavors-setup setup test lint >/dev/null
