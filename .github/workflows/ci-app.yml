name: ci-app
on:
  pull_request:
    paths: ["app/**", ".github/workflows/ci-app.yml"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format lib/l10n/gen
      - name: Generated l10n is committed and up to date
        run: git diff --exit-code lib/l10n/gen
      - run: dart run build_runner build -d
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
  build-android:
    runs-on: ubuntu-latest
    needs: test
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get && dart run build_runner build -d
      - run: flutter build apk --flavor dev -t lib/main_dev.dart --dart-define=USE_MOCK=true
