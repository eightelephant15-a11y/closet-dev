[project]
name = "stylist-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "sentry-sdk[fastapi]>=2.0",
  "structlog>=24.1",
  "firebase-admin>=6.5",
  "boto3>=1.34",
  "arq>=0.26",
  "pillow>=10.3",
  "pillow-heif>=0.18",
  "anthropic>=0.40",
]

[project.optional-dependencies]
# Optional AI background removal (unverified): pip install -e ".[rembg]"
rembg = ["rembg>=2.0"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.22.1",
  "fakeredis>=2.23", "jsonschema>=4.20", "ruff>=0.5", "mypy>=1.10", "psycopg2-binary>=2.9", "greenlet",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
extend-exclude = ["app/domain/taxonomy_data.py"]  # generated
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "E501"]  # the formatter wraps code; long comments and docstrings are fine

[tool.ruff.lint.per-file-ignores]
"app/data/*" = ["E501"]
"app/smoke.py" = ["S101", "E501"]  # a test script: asserts are the point
"tests/*" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "fakeredis.*", "boto3.*", "botocore.*", "pillow_heif.*", "rembg.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::PIL.Image.DecompressionBombWarning"]
testpaths = ["tests"]
