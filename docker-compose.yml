services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: stylist, POSTGRES_PASSWORD: stylist, POSTGRES_DB: stylist }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U stylist"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./api
    env_file: ./api/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://stylist:stylist@db:5432/stylist
      REDIS_URL: redis://redis:6379/0
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./api:/srv"]
volumes:
  pgdata:
