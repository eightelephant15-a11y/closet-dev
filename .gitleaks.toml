title = "stylist gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and test fixtures that look like secrets but are not"
paths = [
  '''docs/openapi\.json''',
  '''app/ios/config/.*\.example''',
  '''api/\.env\.example''',
  '''api/tests/.*''',
  '''app/test/.*''',
]
regexes = [
  '''local-dev-secret-not-for-production''',
  '''REPLACE[_-]?(ME|WITH)[A-Z_-]*''',
]
